name: Huis APK bouwen

on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - manifest.webmanifest
      - icon-512.png
      - .github/workflows/apk.yml

permissions:
  contents: write

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vaste handtekening zetten (zodat updates over de oude app heen kunnen)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Web-bestanden klaarzetten
        run: |
          mkdir www
          cp index.html manifest.webmanifest icon-192.png icon-512.png www/

      - name: Android-project maken
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/browser@6
          npx cap init "Huis" nl.collin.huis --web-dir www
          npx cap add android
          npx cap sync android

      - name: App-link huis:// toevoegen (terug naar de app na bankkoppeling)
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          f='''<intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="huis" />
              </intent-filter>
          '''
          assert '</activity>' in s, 'activity niet gevonden'
          s=s.replace('</activity>', f+'</activity>',1)
          open(p,'w',encoding='utf-8').write(s)
          print('manifest aangepast')
          PY

      - name: Versienummer ophogen (nodig om over de oude app te installeren)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: App-icoon maken
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          res='android/app/src/main/res'
          dens={'mdpi':1,'hdpi':1.5,'xhdpi':2,'xxhdpi':3,'xxxhdpi':4}
          green=(29,92,99,255)
          def house(size, inset):
              im=Image.new('RGBA',(size,size),(0,0,0,0)); d=ImageDraw.Draw(im); s=size
              m=s*inset
              d.polygon([(s/2,m),(s-m,s*0.5),(s*0.8,s*0.5),(s*0.8,s-m),(s*0.2,s-m),(s*0.2,s*0.5),(m,s*0.5)],fill=(255,255,255,255))
              d.rectangle([s*0.44,s*0.58,s*0.56,s-m],fill=green)
              return im
          for n,f in dens.items():
              d=f'{res}/mipmap-{n}'
              os.makedirs(d,exist_ok=True)
              fg=int(108*f)
              house(fg,0.30).save(f'{d}/ic_launcher_foreground.png')
              sz=int(48*f)
              base=Image.new('RGBA',(sz,sz),green); base.alpha_composite(house(sz,0.20))
              base.save(f'{d}/ic_launcher.png'); base.save(f'{d}/ic_launcher_round.png')
          os.makedirs(f'{res}/values',exist_ok=True)
          open(f'{res}/values/ic_launcher_background.xml','w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1D5C63</color>\n</resources>\n')
          print('iconen gemaakt')
          PY

      - name: APK bouwen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK klaarzetten
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Huis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Huis-APK
          path: Huis.apk

      - name: Release maken (directe downloadlink)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" Huis.apk --title "Huis APK ${{ github.run_number }}" --notes "Download Huis.apk en installeer hem op je telefoon. Versie 1.${{ github.run_number }}."
