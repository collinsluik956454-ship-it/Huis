<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f6f5e">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22252a;--mut:#7a7f87;--line:#e6e2d9;--acc:#2f6f5e;--acc2:#e7f1ed;--red:#c0392b;--amb:#c77d0a}
@media(prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#eceae4;--mut:#9aa0a8;--line:#2d3136;--acc:#5bb59c;--acc2:#1f332d;--red:#e5706a;--amb:#e0a542}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 8px}
h1{font-size:22px;margin:0}
.who{font-size:13px;color:var(--mut)}
.who select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
main{padding:0 14px 20px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 8px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}
.row .s{font-size:12.5px;color:var(--mut)}
.done .t b{text-decoration:line-through;color:var(--mut);font-weight:400}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--acc);background:none;flex:none;padding:0;color:#fff;font-size:14px;line-height:1}
.done .chk{background:var(--acc)}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
form.add{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
input,select,button.btn{font:inherit;color:var(--ink)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
form.add input[type=text]{flex:1 1 150px}
button.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
button.ghost{background:var(--acc2);color:var(--acc)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--mut);font:inherit;font-size:11.5px}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--acc);font-weight:600}
.big{display:flex;gap:10px}
.big div{flex:1;background:var(--acc2);border-radius:12px;padding:10px;text-align:center}
.big b{display:block;font-size:24px;color:var(--acc)}
.big small{color:var(--mut);font-size:12px}
.tag{font-size:11.5px;border-radius:99px;padding:2px 8px;background:var(--acc2);color:var(--acc);margin-left:6px}
.over{color:var(--red)}.soon{color:var(--amb)}
.bar{display:flex;justify-content:space-between;align-items:center}
.sync{font-size:12px;color:var(--mut);text-align:center;margin-top:14px}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
</style>
</head>
<body>
<header><h1>🏠 Huis</h1><div class="who"><button id="cog" class="x" aria-label="Instellingen">⚙️</button> Ik ben <select id="me"><option>Collin</option><option>Charlotte</option></select></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
(function(){
var USERS=["Collin","Charlotte"];
var S={tasks:[],shop:[],meals:{},budget:[],maint:[],pool:[],agenda:[],docs:[],bset:{Collin:0,Charlotte:0},bank:{links:[]}};
var tab="home", month=new Date().toISOString().slice(0,7), db=null, mode="lokaal";
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function eur(n){return "€"+Number(n).toFixed(2).replace(".",",")}
var me=ls("me")||"Collin"; document.getElementById("me").value=me;
document.getElementById("me").onchange=function(e){me=e.target.value;ls("me",me);render(true)};

// ---- opslag: lokaal + (optioneel) live sync via Firebase Realtime Database (REST)
var KEYS=["tasks","shop","meals","budget","maint","pool","agenda","docs","bset","bank"], OBJ={meals:1,bset:1,bank:1};
var cfg=ls("huis-cfg")||{url:"",code:""}, meta=ls("huis-at")||{}, syncErr="";
function synced(){return !!(cfg.url&&cfg.code)}
function fb(p){return cfg.url.replace(/\/+$/,"")+"/huis/"+encodeURIComponent(cfg.code)+(p?"/"+p:"")+".json"}
function norm(k,v){if(v==null)return k==="bset"?{Collin:0,Charlotte:0}:k==="bank"?{links:[]}:OBJ[k]?{}:[];if(!OBJ[k]&&!Array.isArray(v))return Object.keys(v).map(function(x){return v[x]});return v}
function pull(){
  if(!synced())return;
  fetch(fb(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
    syncErr="";var ch=false;d=d||{};
    KEYS.forEach(function(k){var r=d[k];if(r&&r.at&&r.at>(meta[k]||0)){S[k]=norm(k,r.v);meta[k]=r.at;ch=true}});
    if(ch){ls("huis-state",S);ls("huis-at",meta);render()} else if(tab==="set")render();
    if(Object.keys(d).length===0&&KEYS.some(function(k){return (S[k]&&(Array.isArray(S[k])?S[k].length:Object.keys(S[k]).length))})) KEYS.forEach(push);
  }).catch(function(e){syncErr="Geen verbinding met Firebase ("+e.message+")";if(tab==="set"||tab==="home")render()});
}
function push(k){
  if(!synced())return; var at=Date.now(); meta[k]=at; ls("huis-at",meta);
  fetch(fb(k),{method:"PUT",body:JSON.stringify({v:S[k],at:at,by:me})}).then(function(r){if(!r.ok)throw new Error(r.status);syncErr=""}).catch(function(e){syncErr="Opslaan online mislukt ("+e.message+"). Wordt later opnieuw geprobeerd.";dirty[k]=1;render()});
}
var dirty={};
function load(){
  var m=(location.hash||"").match(/^#sync=(.+)$/);
  if(m){try{var p=atob(decodeURIComponent(m[1])).split("|");cfg={url:p[0],code:p[1],bankUrl:p[2]||cfg.bankUrl||"",bankToken:p[3]||cfg.bankToken||""};ls("huis-cfg",cfg)}catch(e){}history.replaceState(null,"",location.pathname+location.search)}
  var local=ls("huis-state"); if(local) KEYS.forEach(function(k){if(local[k]!==undefined)S[k]=local[k]});
  var bm=(location.hash||"").match(/^#bank=(.+)$/);
  if(bm){history.replaceState(null,"",location.pathname+location.search);tab="budget";setTimeout(function(){addLinkFromCode(decodeURIComponent(bm[1]))},0)}
  render(); if(synced()){pull();setInterval(function(){if(!document.hidden){Object.keys(dirty).forEach(function(k){delete dirty[k];push(k)});pull()}},5000);document.addEventListener("visibilitychange",function(){if(!document.hidden)pull()})}
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
}
function save(k){ ls("huis-state",S); render(); push(k); }

// ---- helpers
function addMonths(d,m){var x=new Date(d);x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10)}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function nextDue(m){if(!m.last)return today();var u=m.unit||"m";return u==="m"?addMonths(m.last,m.every):addDays(m.last,m.every*(u==="w"?7:1))}
function everyTxt(m){var u=m.unit||"m",n=+m.every;return n+" "+(u==="m"?"mnd":u==="w"?(n>1?"weken":"week"):(n>1?"dagen":"dag"))}
function ibanOk(s){s=(s||"").replace(/\s/g,"").toUpperCase();if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s))return false;var r=(s.slice(4)+s.slice(0,4)).replace(/[A-Z]/g,function(c){return c.charCodeAt(0)-55}),rem=0;for(var i=0;i<r.length;i++)rem=(rem*10+ +r[i])%97;return rem===1}
function ibanFmt(s){return (s||"").replace(/\s/g,"").toUpperCase().replace(/(.{4})/g,"$1 ").trim()}
function alert2(m){var d=document.createElement("div");d.className="card over";d.style.cssText="position:fixed;left:14px;right:14px;top:70px;z-index:9;box-shadow:0 4px 20px #0004";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},4500)}
function line(t,s,c){return '<div class="row"><div class="t"><b>'+t+'</b><div class="s '+(c||"")+'">'+s+'</div></div></div>'}
function back(){return '<button class="btn ghost" data-tab="more" style="margin-bottom:6px">← Meer</button>'}
function daysTo(d){return Math.round((new Date(d)-new Date(today()))/86400000)}
function nlDate(d){return new Date(d).toLocaleDateString("nl-NL",{day:"numeric",month:"short"})}
function userOpts(extra,sel){return (extra||[]).concat(USERS).map(function(u){return '<option'+(u===sel?' selected':'')+'>'+u+'</option>'}).join("")}

// ---- views
var V={};
V.home=function(){
  var open=S.tasks.filter(function(t){return !t.done}), mine=open.filter(function(t){return t.who===me||t.who==="Samen"});
  var shop=S.shop.filter(function(i){return !i.done}).length;
  var spent=S.budget.filter(function(b){return b.date.slice(0,7)===month&&(!b.scope||b.scope==="joint")}).reduce(function(a,b){return a+b.amount},0);
  var inleg=(S.bset.Collin||0)+(S.bset.Charlotte||0);
  var t3=inleg>0?[eur(inleg-spent).replace(",00",""),"over deze maand"]:[eur(spent).replace(",00",""),"uitgegeven deze maand"];
  var h='<div class="card"><div class="big"><div><b>'+mine.length+'</b><small>taken voor jou</small></div><div><b>'+shop+'</b><small>op boodschappenlijst</small></div><div><b>'+t3[0]+'</b><small>'+t3[1]+'</small></div></div></div>';
  var rows=mine.slice(0,5).map(function(t){return line("✅ "+esc(t.text),esc(t.who)+(t.due?" · "+nlDate(t.due):""))});
  S.agenda.filter(function(e){var d=daysTo(e.date);return d>=0&&d<=14}).sort(function(a,b){return (a.date+(a.time||""))<(b.date+(b.time||""))?-1:1}).slice(0,4).forEach(function(e){rows.push(line("📅 "+esc(e.text),nlDate(e.date)+(e.time?" "+esc(e.time):"")+" · "+esc(e.who)))});
  S.maint.filter(function(m){return daysTo(nextDue(m))<=14}).sort(function(a,b){return nextDue(a)<nextDue(b)?-1:1}).slice(0,5).forEach(function(m){var d=daysTo(nextDue(m));rows.push(line((m.cat==="zwembad"?"🏊 ":"🔧 ")+esc(m.name),d<0?"te laat ("+(-d)+" dgn)":d===0?"vandaag":"over "+d+" dgn",d<0?"over":"soon"))});
  S.docs.filter(function(d){return d.end&&daysTo(d.end)<=45}).forEach(function(d){var n=daysTo(d.end);rows.push(line("📄 "+esc(d.name),n<0?"verlopen":"loopt af over "+n+" dgn",n<0?"over":"soon"))});
  h+='<div class="card"><h2>Binnenkort</h2>'+(rows.join("")||'<div class="empty">Niets dringends 🎉</div>')+'</div>';
  var tm=S.meals[todayKey()];
  h+='<div class="card"><h2>Eten vandaag</h2><div>'+(tm?esc(tm):'<span class="empty">Nog niets gepland</span>')+'</div></div>';
  h+='<div class="sync">'+(synced()?(syncErr?'🟠 '+esc(syncErr):'🟢 Live gedeeld'):'⚪ Alleen op dit apparaat — zie ⚙️ om te delen met Charlotte')+'</div>';
  return h;
};
V.tasks=function(){
  var h='<form class="add" data-f="task"><input type="text" name="text" placeholder="Nieuwe taak…" required><select name="who">'+userOpts(["Samen"],me)+'</select><select name="rep"><option value="">Eenmalig</option><option value="7">Wekelijks</option><option value="14">2-wekelijks</option><option value="30">Maandelijks</option></select><input type="date" name="due"><button class="btn">+</button></form>';
  var sorted=S.tasks.slice().sort(function(a,b){return (a.done-b.done)||((a.due||"9")<(b.due||"9")?-1:1)});
  h+='<div class="card">'+(sorted.length?sorted.map(function(t){
    var d=t.due&&!t.done?daysTo(t.due):null;
    return '<div class="row '+(t.done?'done':'')+'"><button class="chk" data-a="tdone" data-id="'+t.id+'">'+(t.done?'✓':'')+'</button><div class="t"><b>'+esc(t.text)+'</b><span class="tag">'+esc(t.who)+'</span><div class="s">'+(t.due?'<span class="'+(d!==null&&d<0?'over':'')+'">'+nlDate(t.due)+'</span>':'')+(t.rep?' · herhaalt elke '+t.rep+' dgn':'')+'</div></div><button class="x" data-a="tdel" data-id="'+t.id+'">×</button></div>';
  }).join(""):'<div class="empty">Geen taken. Voeg er een toe.</div>')+'</div>';
  if(S.tasks.some(function(t){return t.done})) h+='<button class="btn ghost" data-a="tclear">Afgeronde taken opruimen</button>';
  return h;
};
function dayNames(){return["ma","di","wo","do","vr","za","zo"]}
function weekStart(off){var d=new Date();var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w+(off||0)*7);return d.toISOString().slice(0,10)}
function todayKey(){var w=(new Date().getDay()+6)%7;return weekStart(0)+"|"+w}
var weekOff=0;
V.shop=function(){
  var h='<form class="add" data-f="shop"><input type="text" name="text" placeholder="Boodschap toevoegen…" required><button class="btn">+</button></form>';
  var items=S.shop.slice().sort(function(a,b){return a.done-b.done});
  h+='<div class="card"><h2>Boodschappen</h2>'+(items.length?items.map(function(i){
    return '<div class="row '+(i.done?'done':'')+'"><button class="chk" data-a="sdone" data-id="'+i.id+'">'+(i.done?'✓':'')+'</button><div class="t"><b>'+esc(i.text)+'</b></div><button class="x" data-a="sdel" data-id="'+i.id+'">×</button></div>';
  }).join(""):'<div class="empty">Lijst is leeg.</div>')+'</div>';
  if(S.shop.some(function(i){return i.done})) h+='<button class="btn ghost" data-a="sclear">Afgevinkt wissen</button>';
  var ws=weekStart(weekOff);
  h+='<div class="card"><div class="bar"><h2 style="margin:0">Weekmenu</h2><span><button class="x" data-a="wprev">‹</button>'+nlDate(ws)+'<button class="x" data-a="wnext">›</button></span></div>';
  h+=dayNames().map(function(n,i){var k=ws+"|"+i,v=S.meals[k]||"";
    return '<div class="row"><b style="width:26px">'+n+'</b><input type="text" style="flex:1" data-meal="'+k+'" value="'+esc(v)+'" placeholder="—"><button class="x" data-a="m2s" data-k="'+k+'" title="Op boodschappenlijst">🛒</button></div>';}).join("");
  return h+'</div>';
};
var CATS=["Vaste lasten","Boodschappen","Kind","Auto & vervoer","Overig"];
var bsub="joint", imp=null;
// ---- bankkoppeling (via bankbrug)
var BANKNAME={abn:"ABN AMRO",ing:"ING"};
var CAP=window.Capacitor, NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
function openExternal(u){if(NATIVE&&CAP.Plugins&&CAP.Plugins.Browser){CAP.Plugins.Browser.open({url:u})}else location.href=u}
if(NATIVE&&CAP.Plugins&&CAP.Plugins.App){CAP.Plugins.App.addListener("appUrlOpen",function(ev){var m=String((ev&&ev.url)||"").match(/[?&#]bank=([^&#]+)/);if(m){tab="budget";addLinkFromCode(decodeURIComponent(m[1]));render(true)}})}
function links(){return (S.bank&&S.bank.links)||[]}
function bfetchJSON(path,opt){
  opt=opt||{};opt.headers={Authorization:"Bearer "+cfg.bankToken,"Content-Type":"application/json"};
  return fetch(cfg.bankUrl+path,opt).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||("Fout "+r.status));return j})});
}
function addLinkFromCode(code){
  try{
    var bin=atob(code.trim()), u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    var d=JSON.parse(new TextDecoder().decode(u)), st=(d.st||"").split("~"), bk=st[0], sc=st[1]||"joint";
    if(!BANKNAME[bk]||!d.acc||!d.acc.length)throw new Error("Bankcode niet herkend");
    var L=links().filter(function(l){return !(l.bankKey===bk&&l.scope===sc)});
    L.push({bankKey:bk,bank:BANKNAME[bk],scope:sc,acc:d.acc,until:d.until||"",last:""});
    S.bank={links:L};save("bank");alert2("Gekoppeld: "+BANKNAME[bk]);
  }catch(x){alert2("Bankcode ongeldig: "+x.message)}
}
function apiRows(txs){
  var have={};S.budget.forEach(function(b){if(b.ref)have[b.ref]=1});
  var seen={};
  return txs.map(function(t){
    var ref=t.date+"|"+t.amount.toFixed(2)+"|"+t.text.toLowerCase().slice(0,30);seen[ref]=(seen[ref]||0)+1;if(seen[ref]>1)ref+="#"+seen[ref];
    var dup=!!have[ref];
    return {ref:ref,date:t.date,text:t.text,amount:t.amount,cat:guessCat(t.text+" "+(t.desc||"")),on:!dup,dup:dup};
  }).sort(function(a,b){return a.date<b.date?1:-1});
}
function bankCard(){
  var ok=!!(cfg.bankUrl&&cfg.bankToken), L=links();
  var h='<div class="card"><h2>Bankkoppeling</h2>';
  if(!ok)return h+'<div class="empty">Nog niet ingesteld. Ga naar ⚙️ (Meer → Delen &amp; back-up) → Bankkoppeling.</div></div>';
  h+=L.map(function(l,i){
    var d=l.until?daysTo(l.until.slice(0,10)):null;
    return '<div class="row"><div class="t"><b>'+esc(l.bank)+'</b><span class="tag">'+(l.scope==="joint"?"Gezamenlijk":"Eigen "+esc(l.scope))+'</span><div class="s '+(d!==null&&d<0?'over':d!==null&&d<=7?'soon':'')+'">'+(l.acc||[]).map(function(a){return esc(ibanFmt(a.iban||a.name||""))}).join(", ")+(d!==null?' · '+(d<0?'verlopen, koppel opnieuw':'nog '+d+' dgn geldig'):'')+'</div></div><button class="btn ghost" data-a="bfetch" data-i="'+i+'">Ophalen</button><button class="x" data-a="bunlink" data-i="'+i+'">×</button></div>';
  }).join("");
  h+='<form class="add" data-f="blink" style="margin-top:8px"><select name="bank"><option value="abn">ABN AMRO</option><option value="ing">ING</option></select><select name="scope"><option value="joint"'+(bsub==="joint"?" selected":"")+'>Gezamenlijk</option><option value="Collin"'+(bsub==="Collin"?" selected":"")+'>Eigen Collin</option><option value="Charlotte"'+(bsub==="Charlotte"?" selected":"")+'>Eigen Charlotte</option></select><button class="btn">Koppelen</button></form>';
  h+='<div class="add" style="margin:0"><input type="text" id="bcode" placeholder="Bankcode plakken (Android-app)" style="flex:1 1 150px"><button class="btn ghost" data-a="bpaste">Opslaan</button></div>';
  return h+'</div>';
}

function inScope(b){return bsub==="joint"?(!b.scope||b.scope==="joint"):b.scope===bsub}
// ---- CSV van de bank
function parseCSV(t){
  var f=t.split(/\r?\n/)[0]||"", d=[";",",","\t"].map(function(c){return [c,f.split(c).length]}).sort(function(a,b){return b[1]-a[1]})[0][0];
  var rows=[],row=[],cur="",q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true; else if(c===d){row.push(cur);cur=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(function(x){return x!==""}))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(function(x){return x!==""}))rows.push(row);return rows;
}
function num(s){s=String(s).replace(/[€\s]/g,"");if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"");return parseFloat(s)}
function pdate(s){s=String(s).trim();var m;
  if(m=s.match(/^(\d{4})(\d{2})(\d{2})$/))return m[1]+"-"+m[2]+"-"+m[3];
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[1]+"-"+m[2]+"-"+m[3];
  if(m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/))return m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
  return ""}

  else if(a==="bunlink"){var L2=links().slice();L2.splice(+t.dataset.i,1);S.bank={links:L2};save("bank")}
  else if(a==="bpaste"){var bc=document.getElementById("bcode");if(bc&&bc.value.trim())addLinkFromCode(bc.value)}
  else if(a==="btest"){var f2=t.closest("form");cfg.bankUrl=f2.elements.bankUrl.value.trim().replace(/\/+$/,"");cfg.bankToken=f2.elements.bankToken.value.trim();ls("huis-cfg",cfg);alert2("Testen…");bfetchJSON("/health").then(function(j){alert2("Bankbrug werkt ✓ ("+j.app+")")}).catch(function(x){alert2("Bankbrug: "+x.message)})}
  else if(a==="bfetch"){var lk=links()[+t.dataset.i];if(lk){alert2("Ophalen…");var from=lk.last||addDays(today(),-45);
    Promise.all(lk.acc.map(function(ac){return bfetchJSON("/transactions?account="+encodeURIComponent(ac.uid)+"&from="+from)})).then(function(rs){
      var all=[];rs.forEach(function(r){all=all.concat(r.transactions||[])});
      if(!all.length){alert2("Geen nieuwe uitgaven gevonden.");return}
      bsub=lk.scope;imp={rows:apiRows(all),linkIdx:+t.dataset.i};render(true);window.scrollTo(0,0)
    }).catch(function(x){alert2("Ophalen mislukt: "+x.message)})}}
  else if(a==="bsub"){bsub=t.dataset.k;imp=null;render(true)}
  else if(a==="itog"){var r=imp.rows[+t.dataset.i];r.on=!r.on;render(true)}
  else if(a==="icancel"){imp=null;render(true)}
  else if(a==="idone"){var last="";imp.rows.forEach(function(x){if(!x.on)return;S.budget.push({id:uid(),text:x.text,amount:x.amount,who:bsub==="joint"?"Gezamenlijk":bsub,scope:bsub,cat:x.cat,date:x.date,ref:x.ref});if(x.date>last)last=x.date});if(last)month=last.slice(0,7);var li=imp.linkIdx;imp=null;if(li!==undefined&&links()[li]){var L3=links().slice();L3[li]=Object.assign({},L3[li],{last:addDays(today(),-3)});S.bank={links:L3};save("bank")}save("budget");render(true)}
  else if(a==="bdel"){S.budget=S.budget.filter(function(x){return x.id!==id});save("budget")}
  else if(a==="newcode"){var f=t.closest("form");f.elements.code.value=Array.from(crypto.getRandomValues(new Uint8Array(10))).map(function(b){return "abcdefghjkmnpqrstuvwxyz23456789"[b%31]}).join("")}
  else if(a==="exp"){var bl=new Blob([JSON.stringify(S)],{type:"application/json"}),an=document.createElement("a");an.href=URL.createObjectURL(bl);an.download="huis-backup-"+today()+".json";an.click()}
  else if(a==="pdel"){S.pool=S.pool.filter(function(x){return x.id!==id});save("pool")}
  else if(a==="adel"){S.agenda=S.agenda.filter(function(x){return x.id!==id});save("agenda")}
  else if(a==="aclear"){S.agenda=S.agenda.filter(function(x){return daysTo(x.date)>=0});save("agenda")}
  else if(a==="ddel"){S.docs=S.docs.filter(function(x){return x.id!==id});save("docs")}
  else if(a==="poolpre"){[["Filter terugspoelen",1,"w"],["Skimmer en voorfilter legen",1,"w"],["Water testen (pH/chloor)",3,"d"]].forEach(function(x){S.maint.push({id:uid(),name:x[0],every:x[1],unit:x[2],last:"",note:"",cat:"zwembad"})});save("maint")}
  else if(a==="mdone"){o=byId("maint",id);o.last=today();save("maint")}
  else if(a==="mdel"){S.maint=S.maint.filter(function(x){return x.id!==id});save("maint")}
});
document.addEventListener("submit",function(e){
  e.preventDefault();var f=e.target,d=new FormData(f),k=f.dataset.f;
  if(k==="task"){S.tasks.push({id:uid(),text:d.get("text"),who:d.get("who"),rep:d.get("rep"),due:d.get("due")||"",done:false});save("tasks")}
  if(k==="shop"){S.shop.push({id:uid(),text:d.get("text"),done:false});save("shop")}
  if(k==="bud"){S.budget.push({id:uid(),text:d.get("text"),amount:parseFloat(d.get("amount"))||0,who:d.get("who")||bsub,scope:bsub,cat:d.get("cat"),date:month===today().slice(0,7)?today():month+"-01"});save("budget")}
  if(k==="bcfg"){cfg.bankUrl=(d.get("bankUrl")||"").trim().replace(/\/+$/,"");cfg.bankToken=(d.get("bankToken")||"").trim();ls("huis-cfg",cfg);alert2("Opgeslagen");render(true);return}
  if(k==="blink"){alert2("Bank openen…");bfetchJSON("/auth",{method:"POST",body:JSON.stringify({bank:d.get("bank"),scope:d.get("scope")})}).then(function(j){openExternal(j.url)}).catch(function(x){alert2("Koppelen mislukt: "+x.message)});return}
  if(k==="cfg"){cfg=Object.assign({},cfg,{url:(d.get("url")||"").trim(),code:(d.get("code")||"").trim()});ls("huis-cfg",cfg);meta={};ls("huis-at",meta);location.reload();return}
  if(k==="maint"){S.maint.push({id:uid(),name:d.get("text"),every:parseInt(d.get("every"))||1,unit:d.get("unit")||"m",last:d.get("last")||"",note:"",cat:d.get("cat")||"huis"});save("maint")}
  if(k==="pool"){S.pool.push({id:uid(),date:d.get("date"),ph:d.get("ph"),cl:d.get("cl"),temp:d.get("temp"),by:me});save("pool")}
  if(k==="agenda"){S.agenda.push({id:uid(),text:d.get("text"),date:d.get("date"),time:d.get("time")||"",who:d.get("who")});save("agenda")}
  if(k==="doc"){S.docs.push({id:uid(),name:d.get("text"),type:d.get("type"),end:d.get("end")||"",cost:parseFloat(d.get("cost"))||0,note:d.get("note")||""});save("docs")}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="imp"&&t.files[0]){var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);KEYS.forEach(function(k){if(o[k]!==undefined){S[k]=o[k];save(k)}})}catch(x){}};rd.readAsText(t.files[0])}
  if(t.id==="mon"&&t.value){month=t.value;render(true)}
  if(t.dataset.meal!==undefined){if(t.value)S.meals[t.dataset.meal]=t.value;else delete S.meals[t.dataset.meal];save("meals")}
  if(t.id==="csv"&&t.files[0]){var fr=new FileReader();fr.onload=function(){try{var rows=parseBank(fr.result);if(!rows.length)alert2("Geen uitgaven gevonden in dit bestand.");else{imp={rows:rows};render(true)}}catch(x){alert2(x.message)}};fr.readAsText(t.files[0]);t.value=""}
  if(t.dataset.icat!==undefined){imp.rows[+t.dataset.icat].cat=t.value}
  if(t.dataset.iban!==undefined){if(t.dataset.iban==="nr")S.bset.iban=t.value.replace(/\s/g,"").toUpperCase();else S.bset.ibanNaam=t.value.trim();save("bset");render(true)}
  if(t.dataset.bset!==undefined){S.bset[t.dataset.bset]=parseFloat(t.value)||0;save("bset");render(true)}
  if(t.dataset.note!==undefined){var o=byId("maint",t.dataset.note);if(o){o.note=t.value;save("maint")}}
});
document.getElementById("cog").onclick=function(){tab="set";render(true);window.scrollTo(0,0)};
load();
})();
</script>
