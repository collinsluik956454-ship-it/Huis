<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1d5c63">
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#16202b;--mut:#65738a;--line:#e2e7ee;--acc:#1d5c63;--acc2:#e5f0f1;--red:#b42318;--amb:#b54708;--ok:#087443;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04)}
@media(prefers-color-scheme:dark){:root{--bg:#0f151b;--card:#18212a;--ink:#e8edf2;--mut:#93a1b3;--line:#27323d;--acc:#5fb4b8;--acc2:#16313a;--red:#f1837a;--amb:#f0b25a;--ok:#5fd0a0;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
svg{display:block}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.brand b{display:block;font-size:16px;letter-spacing:.2px;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--mut)}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.who select{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
main{padding:0 14px 20px;max-width:640px;margin:0 auto}
.hero{background:linear-gradient(135deg,var(--acc),#2e7d86);color:#fff;border-radius:16px;padding:18px 18px 16px;margin:14px 0 4px;box-shadow:var(--sh)}
.hero small{display:block;opacity:.8;font-size:13px}
.hero h2{font-size:23px;line-height:1.2;margin:3px 0 2px;font-weight:650}
.hero .hs{opacity:.9;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:10px 0;box-shadow:var(--sh)}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 8px;font-weight:600}
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:600}
.row .s{font-size:12.5px;color:var(--mut)}
.ico{flex:none;width:32px;height:32px;border-radius:9px;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center}
.done .t b{text-decoration:line-through;color:var(--mut);font-weight:400}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--acc);background:none;flex:none;padding:0;color:#fff;font-size:13px;line-height:1}
.done .chk{background:var(--acc)}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px;display:inline-flex;align-items:center}
.add{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
input,select,button.btn{font:inherit;color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.add input[type=text]{flex:1 1 150px}
button.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 15px;font-weight:600}
button.ghost,label.ghost{background:var(--acc2);color:var(--acc)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 0 7px;color:var(--mut);font:inherit;font-size:11.5px}
nav button span{display:flex;justify-content:center;margin-bottom:3px}
nav button.on{color:var(--acc);font-weight:600}
.big{display:flex;gap:10px}
.big div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center}
.big b{display:block;font-size:22px;font-weight:650;color:var(--ink);line-height:1.2}
.big small{color:var(--mut);font-size:12px}
.ppl{display:flex;gap:10px;margin:10px 0}
.pc{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--sh)}
.av{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:650;font-size:15px;margin-bottom:8px}
.pc.o .av{background:#8a5a9e}
.pc b{display:block;font-size:15px}
.pc .n{font-size:22px;font-weight:650;line-height:1.2;margin-top:4px}
.pc .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;background:var(--bg);border:1px solid var(--line);color:var(--mut);margin-left:6px;font-weight:500}
.over{color:var(--red)}.soon{color:var(--amb)}
.bar{display:flex;justify-content:space-between;align-items:center}
.sync{font-size:12px;color:var(--mut);text-align:center;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}.dot.g{background:var(--ok)}.dot.a{background:var(--amb)}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);color:var(--ink);font:inherit;font-weight:600;text-align:left}
.mrow span:nth-child(2){flex:1}
.mrow .c{color:var(--mut)}
</style>
</head>
<body>
<header><div class="brand"><span class="logo" id="logo"></span><div><b>Huis</b><small>Collin &amp; Charlotte</small></div></div><div class="who">Ik ben <select id="me"><option>Collin</option><option>Charlotte</option></select><button id="cog" class="x" aria-label="Instellingen"></button></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
(function(){
var USERS=["Collin","Charlotte"];
var S={tasks:[],shop:[],meals:{},budget:[],maint:[],pool:[],agenda:[],docs:[],bset:{Collin:0,Charlotte:0},bank:{links:[]},mdet:{},recipes:[],mset:{days:[0,1,3,4,6],all:false}};
var tab="home", month=new Date().toISOString().slice(0,7), db=null, mode="lokaal";
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
var ICONS={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>',
tasks:'<circle cx="12" cy="12" r="9"/><path d="M8 12.2l2.7 2.8L16 9.5"/>',
cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5H5l2.4 11.5h11l2-8.5H6"/>',
wallet:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/><circle cx="16.5" cy="15" r="1.1"/>',
more:'<circle cx="5.5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18.5" cy="12" r="1.5"/>',
wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
pool:'<path d="M2 8c2.4-1.8 4.6-1.8 7 0s4.6 1.8 7 0 4.4-1.4 6 0"/><path d="M2 14c2.4-1.8 4.6-1.8 7 0s4.6 1.8 7 0 4.4-1.4 6 0"/><path d="M2 20c2.4-1.8 4.6-1.8 7 0s4.6 1.8 7 0 4.4-1.4 6 0"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
gear:'<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/>',
chev:'<path d="M9 6l6 6-6 6"/>'};
function ic(n,s){s=s||20;return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[n]+'</svg>'}
function dot(c){return '<span class="dot '+(c||"")+'"></span>'}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function iso(d){function p(n){return (n<10?"0":"")+n}return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function today(){return iso(new Date())}
function eur(n){return "€"+Number(n).toFixed(2).replace(".",",")}
var me=ls("me")||"Collin"; document.getElementById("me").value=me;
document.getElementById("logo").innerHTML=ic("home",20);document.getElementById("cog").innerHTML=ic("gear",21);
document.getElementById("me").onchange=function(e){me=e.target.value;ls("me",me);render(true)};

// ---- opslag: lokaal + (optioneel) live sync via Firebase Realtime Database (REST)
var KEYS=["tasks","shop","meals","budget","maint","pool","agenda","docs","bset","bank","mdet","recipes","mset"], OBJ={meals:1,bset:1,bank:1,mdet:1,mset:1};
var cfg=ls("huis-cfg")||{url:"",code:""}, meta=ls("huis-at")||{}, syncErr="";
function synced(){return !!(cfg.url&&cfg.code)}
function fb(p){return cfg.url.replace(/\/+$/,"")+"/huis/"+encodeURIComponent(cfg.code)+(p?"/"+p:"")+".json"}
function norm(k,v){if(v==null)return k==="bset"?{Collin:0,Charlotte:0}:k==="bank"?{links:[]}:k==="mset"?{days:[0,1,3,4,6],all:false}:OBJ[k]?{}:[];if(!OBJ[k]&&!Array.isArray(v))return Object.keys(v).map(function(x){return v[x]});return v}
function pull(){
  if(!synced())return;
  fetch(fb(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
    syncErr="";var ch=false;d=d||{};
    KEYS.forEach(function(k){var r=d[k];if(r&&r.at&&r.at>(meta[k]||0)){S[k]=norm(k,r.v);meta[k]=r.at;ch=true}});
    if(ch){ls("huis-state",S);ls("huis-at",meta);render()} else if(tab==="set")render();
    if(Object.keys(d).length===0&&KEYS.some(function(k){return (S[k]&&(Array.isArray(S[k])?S[k].length:Object.keys(S[k]).length))})) KEYS.forEach(push);
  }).catch(function(e){syncErr="Geen verbinding met Firebase ("+e.message+")";if(tab==="set"||tab==="home")render()});
}
function push(k){
  if(!synced())return; var at=Date.now(); meta[k]=at; ls("huis-at",meta);
  fetch(fb(k),{method:"PUT",body:JSON.stringify({v:S[k],at:at,by:me})}).then(function(r){if(!r.ok)throw new Error(r.status);syncErr=""}).catch(function(e){syncErr="Opslaan online mislukt ("+e.message+"). Wordt later opnieuw geprobeerd.";dirty[k]=1;render()});
}
var dirty={};
function load(){
  var m=(location.hash||"").match(/^#sync=(.+)$/);
  if(m){try{var p=atob(decodeURIComponent(m[1])).split("|");cfg={url:p[0],code:p[1],bankUrl:p[2]||cfg.bankUrl||"",bankToken:p[3]||cfg.bankToken||""};ls("huis-cfg",cfg)}catch(e){}history.replaceState(null,"",location.pathname+location.search)}
  var local=ls("huis-state"); if(local) KEYS.forEach(function(k){if(local[k]!==undefined)S[k]=local[k]});
  var bm=(location.hash||"").match(/^#bank=(.+)$/);
  if(bm){history.replaceState(null,"",location.pathname+location.search);tab="budget";setTimeout(function(){addLinkFromCode(decodeURIComponent(bm[1]))},0)}
  render(); if(synced()){pull();setInterval(function(){if(!document.hidden){Object.keys(dirty).forEach(function(k){delete dirty[k];push(k)});pull()}},5000);document.addEventListener("visibilitychange",function(){if(!document.hidden)pull()})}
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
}
function save(k){ ls("huis-state",S); render(); push(k); }

// ---- helpers
function addMonths(d,m){var x=new Date(d+"T12:00:00");x.setMonth(x.getMonth()+m);return iso(x)}
function addDays(d,n){var x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return iso(x)}
function nextDue(m){if(!m.last)return today();var u=m.unit||"m";return u==="m"?addMonths(m.last,m.every):addDays(m.last,m.every*(u==="w"?7:1))}
function everyTxt(m){var u=m.unit||"m",n=+m.every;return n+" "+(u==="m"?"mnd":u==="w"?(n>1?"weken":"week"):(n>1?"dagen":"dag"))}
function ibanOk(s){s=(s||"").replace(/\s/g,"").toUpperCase();if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s))return false;var r=(s.slice(4)+s.slice(0,4)).replace(/[A-Z]/g,function(c){return c.charCodeAt(0)-55}),rem=0;for(var i=0;i<r.length;i++)rem=(rem*10+ +r[i])%97;return rem===1}
function ibanFmt(s){return (s||"").replace(/\s/g,"").toUpperCase().replace(/(.{4})/g,"$1 ").trim()}
function alert2(m){var d=document.createElement("div");d.className="card over";d.style.cssText="position:fixed;left:14px;right:14px;top:70px;z-index:9;box-shadow:0 4px 20px #0004";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},4500)}
function line(t,s,c,i){return '<div class="row">'+(i?'<span class="ico">'+ic(i,18)+'</span>':'')+'<div class="t"><b>'+t+'</b><div class="s '+(c||"")+'">'+s+'</div></div></div>'}
function back(){return '<button class="btn ghost" data-tab="more" style="margin-bottom:6px">← Meer</button>'}
function daysTo(d){return Math.round((new Date(d)-new Date(today()))/86400000)}
function nlDate(d){return new Date(d+"T12:00:00").toLocaleDateString("nl-NL",{day:"numeric",month:"short"})}
function userOpts(extra,sel){return (extra||[]).concat(USERS).map(function(u){return '<option'+(u===sel?' selected':'')+'>'+u+'</option>'}).join("")}

// ---- views
var V={};
V.home=function(){
  var hr=new Date().getHours(), hi=hr<6?"Goedenacht":hr<12?"Goedemorgen":hr<18?"Goedemiddag":"Goedenavond";
  var dt=new Date().toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"});dt=dt.charAt(0).toUpperCase()+dt.slice(1);
  var open=S.tasks.filter(function(t){return !t.done}), mine=open.filter(function(t){return t.who===me||t.who==="Samen"});
  var shop=S.shop.filter(function(i){return !i.done}).length;
  var spent=S.budget.filter(function(b){return b.date.slice(0,7)===month&&(!b.scope||b.scope==="joint")}).reduce(function(a,b){return a+b.amount},0);
  var inleg=(S.bset.Collin||0)+(S.bset.Charlotte||0);
  var t3=inleg>0?[eur(inleg-spent).replace(",00",""),"over deze maand"]:[eur(spent).replace(",00",""),"uitgegeven"];
  var h='<div class="hero"><small>'+esc(dt)+'</small><h2>'+hi+', '+esc(me)+'</h2><div class="hs">'+USERS.map(esc).join(" &amp; ")+'</div></div>';
  h+='<div class="card"><div class="big"><div><b>'+mine.length+'</b><small>taken voor jou</small></div><div><b>'+shop+'</b><small>boodschappen</small></div><div><b>'+t3[0]+'</b><small>'+t3[1]+'</small></div></div></div>';
  h+='<div class="ppl">'+USERS.map(function(u){
    var o=open.filter(function(t){return t.who===u}).sort(function(a,b){return (a.due||"9")<(b.due||"9")?-1:1});
    return '<div class="pc'+(u===USERS[0]?'':' o')+'"><div class="av">'+esc(u.slice(0,2))+'</div><b>'+esc(u)+(u===me?' <span class="s">(jij)</span>':'')+'</b><div class="n">'+o.length+'</div><div class="s">open '+(o.length===1?'taak':'taken')+'</div><div class="s">'+(o[0]?esc(o[0].text):'niets open')+'</div></div>';
  }).join("")+'</div>';
  var shared=open.filter(function(t){return t.who==="Samen"}).length;
  var rows=mine.slice(0,5).map(function(t){return line(esc(t.text),esc(t.who)+(t.due?" · "+nlDate(t.due):""),"","tasks")});
  S.agenda.filter(function(e){var d=daysTo(e.date);return d>=0&&d<=14}).sort(function(a,b){return (a.date+(a.time||""))<(b.date+(b.time||""))?-1:1}).slice(0,4).forEach(function(e){rows.push(line(esc(e.text),nlDate(e.date)+(e.time?" "+esc(e.time):"")+" · "+esc(e.who),"","cal"))});
  S.maint.filter(function(m){return daysTo(nextDue(m))<=14}).sort(function(a,b){return nextDue(a)<nextDue(b)?-1:1}).slice(0,5).forEach(function(m){var d=daysTo(nextDue(m));rows.push(line(esc(m.name),d<0?"te laat ("+(-d)+" dgn)":d===0?"vandaag":"over "+d+" dgn",d<0?"over":"soon",m.cat==="zwembad"?"pool":"wrench"))});
  S.docs.filter(function(d){return d.end&&daysTo(d.end)<=45}).forEach(function(d){var n=daysTo(d.end);rows.push(line(esc(d.name),n<0?"verlopen":"loopt af over "+n+" dgn",n<0?"over":"soon","doc"))});
  h+='<div class="card"><h2>Binnenkort</h2>'+(rows.join("")||'<div class="empty">Niets dringends.</div>')+'</div>';
  var tm=S.meals[todayKey()], tmr=S.meals[keyFor(addDays(today(),1))];
  h+='<div class="card"><h2>Eten</h2><div class="row"><div class="t"><b>'+(tm?esc(tm):'Nog niets gepland')+'</b><div class="s">Vandaag</div></div></div>'+(tmr?'<div class="row"><div class="t"><b>'+esc(tmr)+'</b><div class="s">Morgen</div></div></div>':'')+'</div>';
  h+='<div class="sync">'+(synced()?(syncErr?dot("a")+esc(syncErr):dot("g")+'Live gedeeld met '+esc(USERS.filter(function(u){return u!==me})[0])):dot()+'Alleen op dit apparaat. Delen via Meer → Delen &amp; back-up')+'</div>';
  return h;
};
V.tasks=function(){
  var h='<form class="add" data-f="task"><input type="text" name="text" placeholder="Nieuwe taak…" required><select name="who">'+userOpts(["Samen"],me)+'</select><select name="rep"><option value="">Eenmalig</option><option value="7">Wekelijks</option><option value="14">2-wekelijks</option><option value="30">Maandelijks</option></select><input type="date" name="due"><button class="btn">+</button></form>';
  var sorted=S.tasks.slice().sort(function(a,b){return (a.done-b.done)||((a.due||"9")<(b.due||"9")?-1:1)});
  h+='<div class="card">'+(sorted.length?sorted.map(function(t){
    var d=t.due&&!t.done?daysTo(t.due):null;
    return '<div class="row '+(t.done?'done':'')+'"><button class="chk" data-a="tdone" data-id="'+t.id+'">'+(t.done?'✓':'')+'</button><div class="t"><b>'+esc(t.text)+'</b><span class="tag">'+esc(t.who)+'</span><div class="s">'+(t.due?'<span class="'+(d!==null&&d<0?'over':'')+'">'+nlDate(t.due)+'</span>':'')+(t.rep?' · herhaalt elke '+t.rep+' dgn':'')+'</div></div><button class="x" data-a="tdel" data-id="'+t.id+'">×</button></div>';
  }).join(""):'<div class="empty">Geen taken. Voeg er een toe.</div>')+'</div>';
  if(S.tasks.some(function(t){return t.done})) h+='<button class="btn ghost" data-a="tclear">Afgeronde taken opruimen</button>';
  return h;
};
function mondayOf(ds){var d=new Date(ds+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function weekStart(off){return mondayOf(addDays(today(),(off||0)*7))}
function keyFor(ds){return mondayOf(ds)+"|"+((new Date(ds+"T12:00:00").getDay()+6)%7)}
function todayKey(){return keyFor(today())}
function weekNo(ds){var d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+3-((d.getDay()+6)%7));var y=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-y)/86400000-3+((y.getDay()+6)%7))/7)}
var weekOff=0, etab="menu", openIng={}, clearArm=false, redit=null;
var DOW=["Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag","Zondag"];
function mdays(){var d=S.mset&&S.mset.days;if(!d)return [0,1,3,4,6];return (Array.isArray(d)?d:Object.keys(d).map(function(x){return d[x]})).map(Number)}

function parseCSV(t){
  var f=t.split(/\r?\n/)[0]||"", d=[";",",","\t"].map(function(c){return [c,f.split(c).length]}).sort(function(a,b){return b[1]-a[1]})[0][0];
  var rows=[],row=[],cur="",q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true; else if(c===d){row.push(cur);cur=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(function(x){return x!==""}))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(function(x){return x!==""}))rows.push(row);return rows;
}
function num(s){s=String(s).replace(/[€\s]/g,"");if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"");return parseFloat(s)}
function pdate(s){s=String(s).trim();var m;
  if(m=s.match(/^(\d{4})(\d{2})(\d{2})$/))return m[1]+"-"+m[2]+"-"+m[3];
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[1]+"-"+m[2]+"-"+m[3];
  if(m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/))return m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
  return ""}
var RULES=[[/albert heijn|\bah\b|jumbo|lidl|aldi|plus |dirk|coop|spar|vomar|ekoplaza|hoogvliet|boodschap/i,"Boodschappen"],[/shell|esso|tinq|bp |tankstation|total|ns |ov-chip|parkeer|anwb|garage|apk|kenteken|rdw|fietsenmaker/i,"Auto & vervoer"],[/energie|vattenfall|eneco|essent|greenchoice|vitens|waterbedrijf|verzeker|hypotheek|huur|gemeente|belasting|ziggo|kpn|odido|t-mobile|vodafone|waterschap|zorg|menzis|cz |vgz/i,"Vaste lasten"],[/kinderopvang|prenatal|kruidvat|speelgoed|school|bso|peuter|baby|luier/i,"Kind"]];
function guessCat(t){for(var i=0;i<RULES.length;i++)if(RULES[i][0].test(t))return RULES[i][1];return "Overig"}
function abnName(d){
  var m=d.match(/Naam:\s*(.+?)(?=\s{2,}|\s+(?:Omschrijving|Kenmerk|IBAN|BIC|Machtiging|Incassant|Valuta):|$)/);
  if(m)return m[1].trim();
  d=d.replace(/^(BEA|GEA)[^ ]*?(,\s*(Apple|Google) Pay)?\s+/,"").replace(/^NR:\S+\s+\d\d\.\d\d\.\d\d\/\d\d\.\d\d\s+/,"").replace(/,?PAS\d+.*$/,"").trim();
  return d.trim()}
function parseAbnTab(rows){
  var seen={},out=[];
  rows.forEach(function(r){
    if(r.length<8)return; var amt=num(r[6]); var dt=pdate(r[2]); if(isNaN(amt)||!dt||amt>=0)return; amt=-amt;
    var tx=(abnName(r[7]||"").replace(/\s+/g," ")||"Bankafschrijving").slice(0,48);
    var ref=dt+"|"+amt.toFixed(2)+"|"+tx.toLowerCase().slice(0,30); seen[ref]=(seen[ref]||0)+1; if(seen[ref]>1)ref+="#"+seen[ref];
    out.push({ref:ref,date:dt,text:tx,amount:amt,cat:guessCat(r[7]||""),on:true});
  });
  var have={};S.budget.forEach(function(b){if(b.ref)have[b.ref]=1});
  out.forEach(function(x){if(have[x.ref]){x.dup=true;x.on=false}});
  return out}
function parseBank(text){
  var rows=parseCSV(text);
  if(rows.length&&rows[0].length>=8&&/^\d{8}$/.test((rows[0][2]||"").trim()))return parseAbnTab(rows); if(rows.length<2)throw new Error("Geen regels gevonden");
  var hd=rows[0].map(function(x){return x.toLowerCase().trim().replace(/^﻿/,"")});
  function ix(re){for(var i=0;i<hd.length;i++)if(re.test(hd[i]))return i;return -1}
  var di=ix(/^(datum|date|boekdatum|transactiedatum|rentedatum)/), ai=ix(/^(bedrag|amount)/), si=ix(/^af\s*bij|^af\/bij|^debet\/credit|^(credit\/debet)/), ni=ix(/naam|tegenpartij|counterparty|^name/), oi=ix(/omschrijving|mededeling|description/);
  if(di<0||ai<0)throw new Error("Kolommen 'Datum' en 'Bedrag' niet gevonden. Exporteer een CSV met kopregel.");
  var seen={},out=[];
  rows.slice(1).forEach(function(r){
    var amt=num(r[ai]); if(isNaN(amt))return;
    var neg=amt<0; if(si>=0){var s=(r[si]||"").toLowerCase();neg=/^af|debet|debit/.test(s)}
    if(!neg)return; amt=Math.abs(amt);
    var dt=pdate(r[di]); if(!dt)return;
    var nm=(ni>=0?r[ni]:"")||"", ds=(oi>=0?r[oi]:"")||""; var tx=(nm||ds).replace(/\s+/g," ").trim().slice(0,48)||"Bankafschrijving";
    var ref=dt+"|"+amt.toFixed(2)+"|"+tx.toLowerCase().slice(0,30); seen[ref]=(seen[ref]||0)+1; if(seen[ref]>1)ref+="#"+seen[ref];
    out.push({ref:ref,date:dt,text:tx,amount:amt,cat:guessCat(nm+" "+ds),on:true});
  });
  var have={};S.budget.forEach(function(b){if(b.ref)have[b.ref]=1});
  out.forEach(function(x){if(have[x.ref]){x.dup=true;x.on=false}});
  return out;
}

  if(t.dataset.iban!==undefined){if(t.dataset.iban==="nr")S.bset.iban=t.value.replace(/\s/g,"").toUpperCase();else S.bset.ibanNaam=t.value.trim();save("bset");render(true)}
  if(t.dataset.bset!==undefined){S.bset[t.dataset.bset]=parseFloat(t.value)||0;save("bset");render(true)}
  if(t.dataset.note!==undefined){var o=byId("maint",t.dataset.note);if(o){o.note=t.value;save("maint")}}
});
document.getElementById("cog").onclick=function(){tab="set";render(true);window.scrollTo(0,0)};
load();
})();
</script>
