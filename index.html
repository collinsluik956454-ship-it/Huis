<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1d5c63">
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#16202b;--mut:#65738a;--line:#e2e7ee;--acc:#1d5c63;--acc2:#e5f0f1;--red:#b42318;--amb:#b54708;--ok:#087443;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04)}
@media(prefers-color-scheme:dark){:root{--bg:#0f151b;--card:#18212a;--ink:#e8edf2;--mut:#93a1b3;--line:#27323d;--acc:#5fb4b8;--acc2:#16313a;--red:#f1837a;--amb:#f0b25a;--ok:#5fd0a0;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
svg{display:block}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.brand b{display:block;font-size:16px;letter-spacing:.2px;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--mut)}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.who select{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
main{padding:0 14px 20px;max-width:640px;margin:0 auto}
.hero{background:linear-gradient(135deg,var(--acc),#2e7d86);color:#fff;border-radius:16px;padding:18px 18px 16px;margin:14px 0 4px;box-shadow:var(--sh)}
.hero small{display:block;opacity:.8;font-size:13px}
.hero h2{font-size:23px;line-height:1.2;margin:3px 0 2px;font-weight:650}
.hero .hs{opacity:.9;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:10px 0;box-shadow:var(--sh)}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 8px;font-weight:600}
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:600}
.row .s{font-size:12.5px;color:var(--mut)}
.ico{flex:none;width:32px;height:32px;border-radius:9px;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center}
.done .t b{text-decoration:line-through;color:var(--mut);font-weight:400}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--acc);background:none;flex:none;padding:0;color:#fff;font-size:13px;line-height:1}
.done .chk{background:var(--acc)}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px;display:inline-flex;align-items:center}
.add{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
input,select,button.btn{font:inherit;color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.add input[type=text]{flex:1 1 150px}
button.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 15px;font-weight:600}
button.ghost,label.ghost{background:var(--acc2);color:var(--acc)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 0 7px;color:var(--mut);font:inherit;font-size:11.5px}
nav button span{display:flex;justify-content:center;margin-bottom:3px}
nav button.on{color:var(--acc);font-weight:600}
.big{display:flex;gap:10px}
.big div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center}
.big b{display:block;font-size:22px;font-weight:650;color:var(--ink);line-height:1.2}
.big small{color:var(--mut);font-size:12px}
.ppl{display:flex;gap:10px;margin:10px 0}
.pc{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--sh)}
.av{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:650;font-size:15px;margin-bottom:8px}
.pc.o .av{background:#8a5a9e}
.pc b{display:block;font-size:15px}
.pc .n{font-size:22px;font-weight:650;line-height:1.2;margin-top:4px}
.pc .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;background:var(--bg);border:1px solid var(--line);color:var(--mut);margin-left:6px;font-weight:500}
.over{color:var(--red)}.soon{color:var(--amb)}
.bar{display:flex;justify-content:space-between;align-items:center}
.sync{font-size:12px;color:var(--mut);text-align:center;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}.dot.g{background:var(--ok)}.dot.a{background:var(--amb)}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);color:var(--ink);font:inherit;font-weight:600;text-align:left}
.mrow span:nth-child(2){flex:1}
.mrow .c{color:var(--mut)}
</style>
</head>
<body>
<header><div class="brand"><span class="logo" id="logo"></span><div><b>Huis</b><small>Collin &amp; Charlotte</small></div></div><div class="who">Ik ben <select id="me"><option>Collin</option><option>Charlotte</option></select><button id="cog" class="x" aria-label="Instellingen"></button></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
(function(){
var USERS=["Collin","Charlotte"];
var S={tasks:[],shop:[],meals:{},budget:[],maint:[],pool:[],agenda:[],docs:[],bset:{Collin:0,Charlotte:0},bank:{links:[]},mdet:{},recipes:[],mset:{days:[0,1,3,4,6],all:false},bacc:{}};
var tab="home", month=new Date().toISOString().slice(0,7), db=null, mode="lokaal";
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
var ICONS={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>',
tasks:'<circle cx="12" cy="12" r="9"/><path d="M8 12.2l2.7 2.8L16 9.5"/>',
cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5H5l2.4 11.5h11l2-8.5H6"/>',
wallet:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/><circle cx="16.5" cy="15" r="1.1"/>',
more:'<circle cx="5.5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18.5" cy="12" r="1.5"/>',
wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
pool:'<path d="M2 8c2.4-1.8 4.6-1.8 7 0s4.6 1.8 7 0 4.4-1.4 6 0"/><path d="M2 14c2.4-1.8 4.6-1.8 7 0s4.6 1.8 7 0 4.4-1.4 6 0"/><path d="M2 20c2.4-1.8 4.6-1.8 7 0s4.6 1.8 7 0 4.4-1.4 6 0"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
gear:'<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/>',
chev:'<path d="M9 6l6 6-6 6"/>'};
function ic(n,s){s=s||20;return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[n]+'</svg>'}
function dot(c){return '<span class="dot '+(c||"")+'"></span>'}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function iso(d){function p(n){return (n<10?"0":"")+n}return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function today(){return iso(new Date())}
function eur(n){return "€"+Number(n).toFixed(2).replace(".",",")}
var me=ls("me")||"Collin"; document.getElementById("me").value=me;
document.getElementById("logo").innerHTML=ic("home",20);document.getElementById("cog").innerHTML=ic("gear",21);
document.getElementById("me").onchange=function(e){me=e.target.value;ls("me",me);render(true)};

// ---- opslag: lokaal + (optioneel) live sync via Firebase Realtime Database (REST)
var KEYS=["tasks","shop","meals","budget","maint","pool","agenda","docs","bset","bank","mdet","recipes","mset","bacc"], OBJ={meals:1,bset:1,bank:1,mdet:1,mset:1,bacc:1};
var cfg=ls("huis-cfg")||{url:"",code:""}, meta=ls("huis-at")||{}, syncErr="";
function synced(){return !!(cfg.url&&cfg.code)}
function fb(p,t){return cfg.url.replace(/\/+$/,"")+"/huis/"+encodeURIComponent(cfg.code)+(p?"/"+p:"")+".json"+(t?"?auth="+encodeURIComponent(t):"")}
// ---- inloggen met e-mail (Firebase Authentication, REST), beheerder en leden
var auth=ls("huis-auth"), role=ls("huis-role")||"", admData=null, admLoading=false, reqCount=0, gateTab="login", pullN=0;
var ADM="root.child('admins').child(auth.uid).exists()", MEM="root.child('members').child(auth.uid).exists()";
var RULES_TXT=JSON.stringify({rules:{admins:{".read":"auth != null",".write":"!root.child('admins').exists() || "+ADM},members:{".read":ADM,"$uid":{".read":"auth != null && auth.uid === $uid",".write":ADM}},requests:{".read":ADM,"$uid":{".write":"auth != null && (auth.uid === $uid || "+ADM+")"}},huis:{".read":"auth != null && "+MEM,"$code":{"cfg":{".write":"auth != null && "+ADM},"$other":{".write":"$other !== 'cfg' && auth != null && "+MEM}}}}},null,2);
function authOn(){return !!(cfg.apiKey&&cfg.url)}
function copyTxt(t,msg){try{navigator.clipboard.writeText(t).then(function(){alert2(msg||"Gekopieerd")},function(){alert2("Kopiëren lukt niet, selecteer de tekst zelf")})}catch(x){alert2("Kopiëren lukt niet, selecteer de tekst zelf")}}
function inviteLink(){return location.origin+location.pathname+"#sync="+encodeURIComponent(btoa(cfg.url+"|"+cfg.code+"|||"+(cfg.apiKey||"")))}
function parseInvite(t){t=String(t||"").trim();var m=t.match(/#sync=(.+)$/),x=m?m[1]:t;try{var p=atob(decodeURIComponent(x)).split("|");if(!/^https?:\/\//.test(p[0])||!p[1])return null;return {url:p[0],code:p[1],bankUrl:p[2]||"",bankToken:p[3]||"",apiKey:p[4]||""}}catch(e){return null}}
function tok(){
  if(!authOn())return Promise.resolve("");
  if(!auth||!auth.refreshToken){showGate("welcome");return Promise.reject(new Error("niet ingelogd"))}
  if(auth.exp>Date.now()+60000)return Promise.resolve(auth.idToken);
  return fetch("https://securetoken.googleapis.com/v1/token?key="+encodeURIComponent(cfg.apiKey),{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(auth.refreshToken)}).then(function(r){return r.json().then(function(j){
    if(!r.ok){if(/TOKEN|USER/.test((j.error&&j.error.message)||"")){auth=null;ls("huis-auth",null);showGate("welcome")}throw new Error("sessie verlopen")}
    auth.idToken=j.id_token;auth.refreshToken=j.refresh_token;auth.exp=Date.now()+Number(j.expires_in)*1000;ls("huis-auth",auth);return auth.idToken})});
}
function dbUrl(p,t){return cfg.url.replace(/\/+$/,"")+"/"+p+".json"+(t?"?auth="+encodeURIComponent(t):"")}
function dbReq(p,method,body){
  return tok().then(function(t){return fetch(dbUrl(p,t),{method:method||"GET",body:body===undefined?undefined:JSON.stringify(body)})}).then(function(r){
    if(r.status===401||r.status===403)throw new Error("Geen toegang ("+r.status+")");
    if(!r.ok)throw new Error("Fout "+r.status);return r.json()});
}
function authErr(m){m=m||"";return /INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m)?"E-mailadres of wachtwoord klopt niet":/INVALID_EMAIL/.test(m)?"Dat e-mailadres klopt niet":/EMAIL_EXISTS/.test(m)?"Dit e-mailadres heeft al een account. Kies Inloggen.":/WEAK_PASSWORD/.test(m)?"Kies een wachtwoord van minstens 6 tekens":/OPERATION_NOT_ALLOWED/.test(m)?"Aanmelden staat nog uit. De beheerder moet in Firebase onder Authentication → Instellingen → Gebruikersacties 'Aanmaken (aanmelden)' aanzetten.":/TOO_MANY/.test(m)?"Te vaak geprobeerd, wacht even":/USER_DISABLED/.test(m)?"Dit account is uitgezet":m==="Failed to fetch"?"Geen verbinding":m||"Dat lukte niet"}
function authCall(kind,email,pw){
  return fetch("https://identitytoolkit.googleapis.com/v1/accounts:"+kind+"?key="+encodeURIComponent(cfg.apiKey),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email,password:pw,returnSecureToken:true})}).then(function(r){return r.json().then(function(j){
    if(!r.ok)throw new Error((j.error&&j.error.message)||"");
    auth={email:j.email,uid:j.localId,idToken:j.idToken,refreshToken:j.refreshToken,exp:Date.now()+Number(j.expiresIn)*1000};ls("huis-auth",auth)})});
}
function checkAccess(){
  var u=auth.uid;
  return Promise.all([dbReq("members/"+u),dbReq("admins/"+u)]).then(function(r){
    var m=r[0], isA=!!r[1];
    if(m||isA){
      role=isA?"admin":"member";ls("huis-role",role);
      if(m&&m.who){me=m.who;ls("me",me);document.getElementById("me").value=me}
      else if(isA)dbReq("members/"+u,"PUT",{who:me,email:auth.email,at:Date.now()}).catch(function(){});
      return "ok"}
    return dbReq("admins").then(function(a){
      if(!a){showGate("claim");return "stop"}
      return dbReq("requests/"+u,"PUT",{who:ls("huis-who")||ls("me")||"Collin",email:auth.email,at:Date.now()}).then(function(){showGate("pending");return "stop"})});
  });
}
function gateEl(){
  var d=document.getElementById("gate");if(d)return d;
  d=document.createElement("div");d.id="gate";d.style.cssText="position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start";document.body.appendChild(d);
  d.onclick=function(e){var t=e.target.closest("[data-g]");if(!t)return;var g=t.dataset.g;
    if(g==="tab-login"||g==="tab-signup"){gateTab=g==="tab-login"?"login":"signup";showGate("welcome")}
    else if(g==="reset"){ls("huis-cfg",null);ls("huis-auth",null);ls("huis-role","");location.reload()}
    else if(g==="local"){ls("huis-local",1);location.reload()}
    else if(g==="retry"){location.reload()}
    else if(g==="logout"){auth=null;ls("huis-auth",null);ls("huis-role","");location.reload()}
    else if(g==="copyrules"){copyTxt(RULES_TXT,"Regels gekopieerd")}
    else if(g==="claim"){t.disabled=true;dbReq("admins/"+auth.uid,"PUT",true).then(function(){return dbReq("members/"+auth.uid,"PUT",{who:ls("huis-who")||ls("me")||"Collin",email:auth.email,at:Date.now()})}).then(function(){location.reload()}).catch(function(x){t.disabled=false;showGate(/403|401/.test(x.message)?"rules":"claim",authErr(x.message))})}
  };
  d.onsubmit=function(e){
    e.preventDefault();var f=e.target,k=f.dataset.gf,el=f.elements,msg=f.querySelector(".gmsg"),b=f.querySelector("button");
    function err(t){msg.textContent=t;if(b)b.disabled=false}
    msg.textContent="";if(b)b.disabled=true;
    if(k==="login"){authCall("signInWithPassword",el.email.value.trim(),el.pw.value).then(function(){location.reload()}).catch(function(x){err(authErr(x.message))})}
    else if(k==="signup"){
      if(el.pw.value!==el.pw2.value)return err("De wachtwoorden zijn niet gelijk");
      if(el.pw.value.length<6)return err("Kies een wachtwoord van minstens 6 tekens");
      authCall("signUp",el.email.value.trim(),el.pw.value).then(function(){ls("me",el.who.value);ls("huis-who",el.who.value);location.reload()}).catch(function(x){err(authErr(x.message))})}
    else if(k==="invite"){var iv=parseInvite(el.code.value);if(!iv)return err("Die uitnodiging herken ik niet. Plak de hele link of code.");cfg={url:iv.url,code:iv.code,bankUrl:"",bankToken:"",apiKey:iv.apiKey};ls("huis-cfg",cfg);location.reload()}
    else if(k==="admin"){var u=el.url.value.trim().replace(/\/+$/,""),ak=el.apiKey.value.trim();if(!/^https:\/\/.+/.test(u))return err("De databaseURL moet met https:// beginnen");if(ak.length<20)return err("De Web API-sleutel lijkt te kort");
      cfg={url:u,code:Array.from(crypto.getRandomValues(new Uint8Array(10))).map(function(x){return "abcdefghjkmnpqrstuvwxyz23456789"[x%31]}).join(""),apiKey:ak};ls("huis-cfg",cfg);location.reload()}
  };
  return d;
}
function hideGate(){var d=document.getElementById("gate");if(d)d.remove()}
function gHead(sub){return '<div style="text-align:center;margin:26px 0 16px"><span style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:18px;background:var(--acc);color:#fff">'+ic("home",34)+'</span><h2 style="margin:12px 0 2px;font-size:26px">Huis</h2><div style="color:var(--mut);font-size:14px">'+sub+'</div></div>'}
function gIn(name,type,ph,ac){return '<input type="'+type+'" name="'+name+'" placeholder="'+ph+'" autocomplete="'+(ac||"off")+'" required style="width:100%;margin-bottom:8px">'}
function gCard(k,inner,msg){return '<form class="card" data-gf="'+k+'" style="margin:0 0 12px">'+inner+'<p class="gmsg over" style="font-size:13px;margin:8px 0 0">'+esc(msg||"")+'</p></form>'}
function gBtn(g,t,cls){return '<button type="button" class="btn '+(cls===undefined?"ghost":cls)+'" data-g="'+g+'" style="width:100%;margin-top:8px">'+t+'</button>'}
function showGate(mode,msg){
  var d=gateEl(), c='<div style="width:100%;max-width:400px">';
  if(mode==="busy")c+=gHead("Even laden…");
  else if(mode==="welcome"){
    c+=gHead("Collin &amp; Charlotte")+'<div class="add" style="margin:0 0 12px"><button class="btn '+(gateTab==="login"?"":"ghost")+'" data-g="tab-login" style="flex:1">Inloggen</button><button class="btn '+(gateTab==="signup"?"":"ghost")+'" data-g="tab-signup" style="flex:1">Aanmelden</button></div>';
    if(gateTab==="login")c+=gCard("login",gIn("email","email","E-mailadres","username")+gIn("pw","password","Wachtwoord","current-password")+'<button class="btn" style="width:100%">Inloggen</button>',msg);
    else c+=gCard("signup",'<label style="font-size:13px;color:var(--mut)">Wie ben je?</label><select name="who" style="width:100%;margin:4px 0 8px"><option>Collin</option><option>Charlotte</option></select>'+gIn("email","email","E-mailadres","username")+gIn("pw","password","Wachtwoord (minstens 6 tekens)","new-password")+gIn("pw2","password","Herhaal wachtwoord","new-password")+'<button class="btn" style="width:100%">Aanmelden</button><p style="font-size:12px;color:var(--mut);margin:8px 0 0">Na het aanmelden keurt de beheerder je aanvraag goed. De allereerste die zich aanmeldt wordt beheerder.</p>',msg);
    c+='<p style="text-align:center;margin:6px 0 0"><button type="button" class="btn ghost" data-g="reset" style="font-size:12px;padding:6px 10px">Andere verbinding gebruiken</button></p>';
  }
  else if(mode==="setup"){
    c+=gHead("Welkom bij de huisapp van Collin &amp; Charlotte")
      +gCard("invite",'<h2 style="margin:0 0 6px">Ik heb een uitnodiging</h2><p style="font-size:13px;color:var(--mut);margin:0 0 8px">Plak de link of code die je van de beheerder kreeg.</p><input type="text" name="code" placeholder="Uitnodigingslink of code" required style="width:100%;margin-bottom:8px"><button class="btn" style="width:100%">Verder</button>',"")

  else if(a==="pdel"){S.pool=S.pool.filter(function(x){return x.id!==id});save("pool")}
  else if(a==="acal"){var ev=S.agenda.filter(function(x){return x.id===id})[0];if(ev){var dd=ev.date.replace(/-/g,""),dts;
    if(ev.time){var hm=ev.time.replace(":",""),eh=parseInt(ev.time.slice(0,2),10)+1,em=ev.time.slice(3,5);dts=dd+"T"+hm+"00/"+(eh<24?dd+"T"+(eh<10?"0":"")+eh+em+"00":dd+"T235900")}
    else dts=dd+"/"+addDays(ev.date,1).replace(/-/g,"");
    openExternal("https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(ev.text)+"&dates="+dts+"&ctz=Europe%2FAmsterdam&details="+encodeURIComponent("Huis-app ("+ev.who+")"))}}
  else if(a==="pcal"){pcalErr="";loadPcal(true)}
  else if(a==="adel"){S.agenda=S.agenda.filter(function(x){return x.id!==id});save("agenda")}
  else if(a==="aclear"){S.agenda=S.agenda.filter(function(x){return daysTo(x.date)>=0});save("agenda")}
  else if(a==="ddel"){S.docs=S.docs.filter(function(x){return x.id!==id});save("docs")}
  else if(a==="poolpre"){[["Filter terugspoelen",1,"w"],["Skimmer en voorfilter legen",1,"w"],["Water testen (pH/chloor)",3,"d"]].forEach(function(x){S.maint.push({id:uid(),name:x[0],every:x[1],unit:x[2],last:"",note:"",cat:"zwembad"})});save("maint")}
  else if(a==="mdone"){o=byId("maint",id);o.last=today();save("maint")}
  else if(a==="mdel"){S.maint=S.maint.filter(function(x){return x.id!==id});save("maint")}
});
document.addEventListener("submit",function(e){
  e.preventDefault();var f=e.target,d=new FormData(f),k=f.dataset.f;
  if(k==="task"){S.tasks.push({id:uid(),text:d.get("text"),who:d.get("who"),rep:d.get("rep"),due:d.get("due")||"",done:false});save("tasks")}
  if(k==="shop"){S.shop.push({id:uid(),text:d.get("text"),done:false});save("shop")}
  if(k==="bud"){S.budget.push({id:uid(),text:d.get("text"),amount:parseFloat(d.get("amount"))||0,who:d.get("who")||bsub,scope:bsub,cat:d.get("cat"),date:month===today().slice(0,7)?today():month+"-01"});save("budget")}
  if(k==="bcfg"){cfg.bankUrl=(d.get("bankUrl")||"").trim().replace(/\/+$/,"");cfg.bankToken=(d.get("bankToken")||"").trim();ls("huis-cfg",cfg);pushCfg();alert2("Opgeslagen");render(true);return}
  if(k==="recipe"){var rid=d.get("id"),rn=(d.get("text")||"").trim(),ri=d.get("ing")||"";if(rn){if(rid){var re=S.recipes.filter(function(r){return r.id===rid})[0];if(re){re.name=rn;re.ing=ri}}else S.recipes.push({id:uid(),name:rn,ing:ri})}redit=null;save("recipes");return}
  if(k==="blink"){alert2("Bank openen…");bfetchJSON("/auth",{method:"POST",body:JSON.stringify({bank:d.get("bank"),scope:d.get("scope")})}).then(function(j){openExternal(j.url)}).catch(function(x){alert2("Koppelen mislukt: "+x.message)});return}
  if(k==="cfg"){cfg=Object.assign({},cfg,{url:(d.get("url")||"").trim(),code:(d.get("code")||"").trim(),apiKey:(d.get("apiKey")||"").trim()});ls("huis-cfg",cfg);meta={};ls("huis-at",meta);location.reload();return}
  if(k==="maint"){S.maint.push({id:uid(),name:d.get("text"),every:parseInt(d.get("every"))||1,unit:d.get("unit")||"m",last:d.get("last")||"",note:"",cat:d.get("cat")||"huis"});save("maint")}
  if(k==="pool"){S.pool.push({id:uid(),date:d.get("date"),ph:d.get("ph"),cl:d.get("cl"),temp:d.get("temp"),by:me});save("pool")}
  if(k==="agenda"){S.agenda.push({id:uid(),text:d.get("text"),date:d.get("date"),time:d.get("time")||"",who:d.get("who")});save("agenda")}
  if(k==="doc"){S.docs.push({id:uid(),name:d.get("text"),type:d.get("type"),end:d.get("end")||"",cost:parseFloat(d.get("cost"))||0,note:d.get("note")||""});save("docs")}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="imp"&&t.files[0]){var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);KEYS.forEach(function(k){if(o[k]!==undefined){S[k]=o[k];save(k)}})}catch(x){}};rd.readAsText(t.files[0])}
  if(t.id==="mon"&&t.value){month=t.value;render(true)}
  if(t.dataset.pick!==undefined&&t.value){var rp=S.recipes.filter(function(r){return r.id===t.value})[0];if(rp){S.meals[t.dataset.pick]=rp.name;S.mdet[t.dataset.pick]={ing:rp.ing||""};save("meals");save("mdet");render(true)}}
  if(t.dataset.ing!==undefined){S.mdet[t.dataset.ing]={ing:t.value};save("mdet")}
  if(t.dataset.meal!==undefined){if(t.value)S.meals[t.dataset.meal]=t.value;else delete S.meals[t.dataset.meal];save("meals")}
  if(t.id==="csv"&&t.files[0]){var fr=new FileReader();fr.onload=function(){try{var rows=parseBank(fr.result);if(!rows.length)alert2("Geen uitgaven gevonden in dit bestand.");else{imp={rows:rows};render(true)}}catch(x){alert2(x.message)}};fr.readAsText(t.files[0]);t.value=""}
  if(t.dataset.icat!==undefined){imp.rows[+t.dataset.icat].cat=t.value}
  if(t.dataset.iban!==undefined){if(t.dataset.iban==="nr")S.bset.iban=t.value.replace(/\s/g,"").toUpperCase();else S.bset.ibanNaam=t.value.trim();save("bset");render(true)}
  if(t.dataset.bset!==undefined){S.bset[t.dataset.bset]=parseFloat(t.value)||0;save("bset");render(true)}
  if(t.dataset.note!==undefined){var o=byId("maint",t.dataset.note);if(o){o.note=t.value;save("maint")}}
});
document.getElementById("cog").onclick=function(){tab="set";render(true);window.scrollTo(0,0)};
load();
})();
</script>
